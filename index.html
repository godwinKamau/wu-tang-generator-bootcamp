<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wu-Tang Generator</title>
    <meta name="description" content="Creating a Wu-Tang name generator">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BBH+Sans+Bartle&family=BBH+Sans+Bogle&family=BBH+Sans+Hegarty&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <section class="title">
            <h1>Wu-Tang Name Generator</h1>
        </section>
        <section class="instructions">
            <p>Insert your first and last name</p>
        </section>
        <section class="insertName">
            <input type="text" id="firstname" placeholder="First Name">
            <input type="text" id="lastname" placeholder="Last Name">
            <button id="wuMaker">Enter the Clan</button>
        </section>
        <section>
            <label for="dynasty">What Wu-Tang style best describes you?</label>
            <input type="radio" name="dynasty" value="1"> Classic Wu-Tang
            <input type="radio" name="dynasty" value="2"> Shaolin Master
            <input type="radio" name="dynasty" value="3"> Street Disciple
            <label for="color">What color is your soul?</label>
            <select name="color" id="color">
                <option value="1">Purple</option>
                <option value="2">Jade</option>
                <option value="3">Fuschia</option>
                <option value="4">Grey</option>
                <option value="5">Blue</option>
            </select>
        </section>
        <section class="wuProduct">
            <h3></h3>
            <h2></h2>
        </section>
        <div></div>
    </div>
    <script type="text/javascript" src="js/main.js"></script>
</body>
</html>
